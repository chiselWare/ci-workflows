name: Reusable Workflow - Make Dry Run

on:
  workflow_call:
    inputs:
      make_target:
        required: false
        type: string
        default: "all"
      make_dir:
        required: false
        type: string
        default: "."
    secrets: {}

permissions:
  contents: read

jobs:
  make-dry-run:
    name: make -n ${{ inputs.make_target }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo
        uses: chiselWare/actions-checkout@v4

      - name: Make dry-run
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ inputs.make_dir }}"
          make -n "${{ inputs.make_target }}" | tee make-dry-run.txt

      - name: Upload dry-run output
        if: always()
        uses: chiselWare/actions-upload-artifact@v4
        with:
          name: make-dry-run
          path: |
            ${{ inputs.make_dir }}/make-dry-run.txt
          if-no-files-found: error
