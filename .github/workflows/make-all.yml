name: make-all

# Reusable workflow: runs `make <target>` for a chiselWare core inside the
# chiselWare dev container on a GitHub-hosted runner.
#
# Caller example (identical in every core repo):
#   jobs:
#     make-all:
#       uses: chiselWare/ci-workflows/.github/workflows/make-all.yml@v0

on:
  workflow_call:
    inputs:
      make_target:
        description: "Makefile target to run"
        required: false
        type: string
        default: "all"
      container_image:
        description: "Container image providing the chiselWare toolchain"
        required: false
        type: string
        default: "ghcr.io/chiselware/dev-full:0.8.0"
      runs_on:
        description: "Runner label (GitHub-hosted by default)"
        required: false
        type: string
        default: "ubuntu-latest"
      working_directory:
        description: "Directory containing the Makefile"
        required: false
        type: string
        default: "."
      timeout_minutes:
        description: "Job timeout"
        required: false
        type: number
        default: 60

jobs:
  make:
    # Deliberately repo-independent so one org-wide ruleset can require
    # the same status check ("make-all / make all") in every core repo.
    name: make ${{ inputs.make_target }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}

    container:
      image: ${{ inputs.container_image }}
      # Run as root so actions/checkout and actions/cache can write to the
      # runner-mounted workspace regardless of the image's default user.
      options: --user root

    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Toolchain versions
        run: |
          set +e
          echo "image: ${{ inputs.container_image }}"
          java -version 2>&1 | head -1
          sbt --script-version
          firtool --version | head -1
          verilator --version
          yosys -V
          sby --help >/dev/null 2>&1 && echo "sby: present"
          exit 0

      # Cache key computed inside the container rather than with hashFiles(),
      # which is evaluated on the host and fails on some container-job
      # workspaces. This also respects working_directory.
      - name: Compute build-definition hash
        id: buildhash
        run: |
          hash=$(cat build.sbt project/build.properties project/*.sbt 2>/dev/null \
                 | sha256sum | cut -c1-16)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Cache sbt / coursier / ivy
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: sbt-${{ runner.os }}-${{ steps.buildhash.outputs.hash }}
          restore-keys: |
            sbt-${{ runner.os }}-

      - name: make ${{ inputs.make_target }}
        run: make ${{ inputs.make_target }}

      - name: Upload test outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ inputs.make_target }}-logs
          path: |
            ${{ inputs.working_directory }}/test_run_dir/**
            ${{ inputs.working_directory }}/**/target/test-reports/**
          if-no-files-found: ignore
          retention-days: 7
