name: Reusable Workflow - Make All

on:
  workflow_call:
    inputs:
      make_target:
        required: false
        type: string
        default: "all"
      make_dir:
        required: false
        type: string
        default: "."
      runner_labels:
        description: 'JSON array of runner labels, e.g. ["self-hosted","local-ci"]'
        required: false
        type: string
        default: '["self-hosted","local-ci"]'
      artifacts_path:
        description: 'Glob(s) to upload on completion'
        required: false
        type: string
        default: '["out/**","logs/**","reports/**","**/*.log","**/*.rpt","**/*.pdf","**/*design-review*.html"]'

jobs:
  make-all:
    name: make ${{ inputs.make_target }}
    runs-on: ${{ fromJson(inputs.runner_labels) }}
    steps:
      - name: Checkout caller repo
        uses: chiselWare/actions-checkout@v4

      - name: Run make
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ inputs.make_dir }}"
          make "${{ inputs.make_target }}"

      - name: Check error report
        shell: bash
        run: |
          set -euo pipefail
          mod="${{ inputs.module_name }}"
          rpt="modules/${mod}/generated/error.rpt"

          if [[ ! -f "$rpt" ]]; then
            echo "ERROR: missing error report: $rpt"
            exit 2
          fi

          if [[ -s "$rpt" ]]; then
            echo "ERROR: error report is non-empty (regression failed): $rpt"
            echo "---- first 200 lines ----"
            sed -n '1,200p' "$rpt" || true
            exit 3
          fi

          echo "OK: $rpt exists and is empty."

      - name: Upload error report (always)
        if: always()
        uses: chiselWare/actions-upload-artifact@v4
        with:
          name: regression-error-report
          path: modules/${{ inputs.module_name }}/generated/error.rpt
          if-no-files-found: error
